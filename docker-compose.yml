services:
  db:
    image: mongo:7
    container_name: db
    restart: unless-stopped
    volumes:
      - db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "if (db.adminCommand('ping').ok !== 1) { quit(1); }"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      MONGO_INITDB_DATABASE: app

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      - api-logs:/app/logs

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

  proxy:
    image: nginx:alpine
    container_name: proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  db-data:
  redis-data:
  api-logs: